name: Template Content Evals

# Phase 1 static content evaluation of agent-factory templates.
# Grades each changed *.md template on structure + tool/config well-formedness (deterministic)
# and an LLM judge (clarity, non-contradiction, scope, completeness, instruction/tool alignment).
# No agent is run and no tools are executed — safe to run on every PR.
#
# The evaluator runs as a Python script (scripts/template_content_eval.py) — no external service
# or Docker image required.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'agent_factory_schema/**'
      - 'scripts/template_content_eval.py'
      - '.github/workflows/template_content_evals.yaml'
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Minimum judge score to pass (0.0-1.0)'
        required: false
        default: '0.8'

permissions:
  contents: read
  pull-requests: write

env:
  THRESHOLD: ${{ github.event.inputs.threshold || '0.8' }}

jobs:
  content-eval:
    runs-on: [self-hosted, nonprod, ecx]
    steps:
      - name: Check out agent-factory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine templates to evaluate
        id: templates
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              -- 'agent_factory_schema/**/*.md' | paste -sd, -)
            if [[ -z "$CHANGED" ]]; then
              echo "No template (.md) changes in this PR — nothing to evaluate."
              echo "mode=none" >> "$GITHUB_OUTPUT"
            else
              echo "Changed templates: $CHANGED"
              echo "mode=changed" >> "$GITHUB_OUTPUT"
              echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Full-suite run over agent_factory_schema."
            echo "mode=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.templates.outputs.mode != 'none'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: steps.templates.outputs.mode != 'none'
        run: pip install -r scripts/requirements.txt

      - name: Run template content evals
        if: steps.templates.outputs.mode != 'none'
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=(--threshold="${THRESHOLD}" \
                --experiment="pr-${{ github.event.pull_request.number || github.run_number }}")
          if [[ "${{ steps.templates.outputs.mode }}" == "changed" ]]; then
            ARGS+=(--changed="${{ steps.templates.outputs.changed }}")
          else
            ARGS+=(--templates-dir=agent_factory_schema)
          fi
          echo "Running: python scripts/template_content_eval.py ${ARGS[*]}"
          python scripts/template_content_eval.py "${ARGS[@]}"

      - name: Post eval results to PR
        uses: actions/github-script@v7
        if: steps.templates.outputs.mode != 'none' && always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('eval_report.md')) {
              console.log('No eval_report.md found — skipping comment.');
              return;
            }
            const report = fs.readFileSync('eval_report.md', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });
