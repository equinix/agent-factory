name: Template Content Evals

# Phase 1 static content evaluation of agent-factory templates.
# Grades each changed *.md template on structure + tool/config well-formedness (deterministic)
# and an LLM judge (clarity, non-contradiction, scope, completeness, instruction/tool alignment).
# No agent is run and no tools are executed — safe to run on every PR.
#
# The LLM judge calls agent-eval-service (POST /fabric/v4/eval/template-content) through the
# external Apigee gateway. agent-eval-service runs in-cluster and can reach AWS Bedrock Runtime
# (VPC-only) where the GitHub Actions runner cannot — but the external v4 route is reachable
# from a normal ubuntu-latest runner, unlike the internal /fabric/i4/* route. The runner
# authenticates with an OAuth2 Bearer token (grant_type=password) via Apigee.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'agent_factory_schema/**'
      - 'scripts/template_content_eval.py'
      - '.github/workflows/template_content_evals.yaml'
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Minimum judge score to pass (0.0-1.0)'
        required: false
        default: '0.6'

permissions:
  contents: read
  pull-requests: write

env:
  THRESHOLD: ${{ github.event.inputs.threshold || '0.6' }}
  APIGEE_TOKEN_URL: ${{ vars.APIGEE_TOKEN_URL || 'https://sitapi.equinix.com/oauth2/v1/token' }}
  AGENT_EVAL_SERVICE_URL: ${{ vars.AGENT_EVAL_SERVICE_URL || 'https://sitapi.equinix.com' }}

jobs:
  content-eval:
    # Skip runs triggered by the auto-commit bot (sync_data_schema_updates.yaml pushes a
    # regenerated catalog/README back onto the PR branch) — this eval doesn't depend on that
    # regeneration, and re-running here just duplicates the run already triggered by the
    # human's push while surfacing a confusing action_required check.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out agent-factory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine templates to evaluate
        id: templates
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              -- 'agent_factory_schema/**/*.md' | paste -sd, -)
            if [[ -z "$CHANGED" ]]; then
              echo "No template (.md) changes in this PR — nothing to evaluate."
              echo "mode=none" >> "$GITHUB_OUTPUT"
            else
              echo "Changed templates: $CHANGED"
              echo "mode=changed" >> "$GITHUB_OUTPUT"
              echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Full-suite run over agent_factory_schema."
            echo "mode=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.templates.outputs.mode != 'none'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: steps.templates.outputs.mode != 'none'
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Debug Apigee token + eval endpoint
        if: steps.templates.outputs.mode != 'none'
        env:
          APIGEE_CLIENT_ID: ${{ secrets.APIGEE_CLIENT_ID }}
          APIGEE_CLIENT_SECRET: ${{ secrets.APIGEE_CLIENT_SECRET }}
          APIGEE_SERVICE_USERNAME: ${{ secrets.APIGEE_SERVICE_USERNAME }}
          APIGEE_SERVICE_PASSWORD: ${{ secrets.APIGEE_SERVICE_PASSWORD }}
        run: |
          set -uo pipefail
          TOKEN=$(curl -s -X POST "${APIGEE_TOKEN_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"grant_type\":\"password\",\"user_name\":\"${APIGEE_SERVICE_USERNAME}\",\"user_password\":\"${APIGEE_SERVICE_PASSWORD}\",\"client_id\":\"${APIGEE_CLIENT_ID}\",\"client_secret\":\"${APIGEE_CLIENT_SECRET}\"}" \
            | jq -r '.access_token // empty')
          echo "Token length: ${#TOKEN}"
          echo "--- curl tiny body ---"
          curl -s -o /dev/null -w "HTTP status: %{http_code}\n" \
            -X POST "${AGENT_EVAL_SERVICE_URL}/fabric/v4/eval/template-content" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"templateMarkdown":"## Overview\nTest","templatePath":"debug/test.md"}'
          echo "--- curl actual small template (2KB) ---"
          jq -Rsc '{templateMarkdown:., templatePath:"debug/small.md"}' \
            agent_factory_schema/equinix/fabric/v1/on_event/connection/connection-metro-latency-notify.md \
            > /tmp/small_body.json
          echo "Body: $(wc -c < /tmp/small_body.json) bytes"
          curl -s -o /dev/null -w "HTTP status: %{http_code}\n" \
            -X POST "${AGENT_EVAL_SERVICE_URL}/fabric/v4/eval/template-content" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/small_body.json
          echo "--- httpx with small template (shows exact headers) ---"
          export DEBUG_TOKEN="${TOKEN}"
          python3 scripts/debug_apigee.py

      - name: Run template content evals
        if: steps.templates.outputs.mode != 'none'
        env:
          APIGEE_CLIENT_ID: ${{ secrets.APIGEE_CLIENT_ID }}
          APIGEE_CLIENT_SECRET: ${{ secrets.APIGEE_CLIENT_SECRET }}
          APIGEE_SERVICE_USERNAME: ${{ secrets.APIGEE_SERVICE_USERNAME }}
          APIGEE_SERVICE_PASSWORD: ${{ secrets.APIGEE_SERVICE_PASSWORD }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=(--threshold="${THRESHOLD}" \
                --experiment="pr-${{ github.event.pull_request.number || github.run_number }}")
          if [[ "${{ steps.templates.outputs.mode }}" == "changed" ]]; then
            ARGS+=(--changed="${{ steps.templates.outputs.changed }}")
          else
            ARGS+=(--templates-dir=agent_factory_schema)
          fi
          echo "Running: python scripts/template_content_eval.py ${ARGS[*]}"
          python scripts/template_content_eval.py "${ARGS[@]}"

      - name: Post eval results to PR
        uses: actions/github-script@v7
        if: steps.templates.outputs.mode != 'none' && (success() || failure())
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('eval_report.md')) {
              console.log('No eval_report.md found — skipping comment.');
              return;
            }
            const report = fs.readFileSync('eval_report.md', 'utf8');
            const marker = '<!-- template-content-eval-report -->';

            // Find and update existing bot comment rather than always creating a new one
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: report,
              });
              console.log('Updated existing eval comment:', existing.id);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report,
              });
              console.log('Created new eval comment.');
            }
